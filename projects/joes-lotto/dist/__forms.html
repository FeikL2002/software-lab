<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Joe’s Lotto update requests</title></head><body>
<!-- Static definition for Netlify Forms. The app submits matching fields here. -->
<form name="joes-app-update-request" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="joes-app-update-request">
  <input name="name" type="text">
  <select name="category"><option>Idea for the app</option><option>Problem to fix</option><option>Other</option></select>
  <input name="title" type="text">
  <textarea name="message"></textarea>
  <input name="email" type="email">
  <input name="app-page" type="hidden">
  <input name="subject" type="hidden" value="Joe's Lotto: update request">
  <input name="bot-field" type="text">
</form>
<p>Update requests are sent from the form inside <a href="/">Joe’s Lotto App</a>.</p>
</body></html>
